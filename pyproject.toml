[project]
name = "leadsmith"
version = "0.2.0"
description = "A local multi-agent prospecting engine with a dashboard, powered by your own Claude Code: find buyers from free signals, research accounts, draft outreach you approve, send from Gmail."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.31",
    "tzdata>=2024.1",
]

[project.scripts]
leadsmith = "leadsmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadsmith"]
